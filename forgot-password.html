<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | StudyNotes</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="auth">
  <main class="page-shell auth-page-shell">
    <section class="page-intro auth-intro">
      <div class="brand auth-brand" aria-label="StudyNotes"><span class="brand-mark">SN</span><span>StudyNotes</span></div>
      <div class="eyebrow">Account recovery</div>
      <h1>Reset your password</h1>
      <p class="lede">We’ll send a secure link so you can choose a new password.</p>
    </section>
    <form id="forgot-form" class="auth-form" novalidate>
      <div class="card">
        <label>Email<input name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required></label>
        <button class="button button-primary" type="submit">Send reset link</button>
        <div id="auth-message" class="auth-message" hidden></div>
      </div>
    </form>
    <p class="auth-footer"><a class="text-link" href="./signin.html">Back to sign in</a></p>
  </main>
  <script type="module" src="assets/js/auth-pages.js"></script>
</body>
</html>
