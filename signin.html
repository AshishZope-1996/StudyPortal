<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | StudyNotes</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="auth">
  <main class="page-shell auth-page-shell">
    <section class="page-intro auth-intro">
      <div class="brand auth-brand" aria-label="StudyNotes"><span class="brand-mark">SN</span><span>StudyNotes</span></div>
      <div class="eyebrow">Welcome back</div>
      <h1>Sign in</h1>
      <p class="lede">Keep your notes, quizzes and reading history with you.</p>
    </section>
    <form id="signin-form" class="auth-form" novalidate>
      <div class="card">
        <label>Email<input name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required></label>
        <label>Password
          <div class="password-toggle">
            <input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="password-visibility" aria-label="Show password">Show</button>
          </div>
        </label>
        <button class="button button-primary" type="submit">Sign in</button>
        <div class="auth-links-row"><a class="text-link" href="./forgot-password.html">Forgot password?</a></div>
        <div class="auth-divider"><span>OR</span></div>
        <button class="button google-button" id="google-signin" type="button"><span class="google-icon" aria-hidden="true">G</span><span>Continue with Google</span></button>
        <div id="auth-message" class="auth-message" hidden></div>
      </div>
    </form>
    <p class="auth-footer">Need an account? <a class="text-link" href="./signup.html">Create one</a></p>
  </main>
  <script type="module" src="assets/js/auth-pages.js"></script>
</body>
</html>
