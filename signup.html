<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | StudyNotes</title><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/auth.css"></head><body data-page="auth"><main class="page-shell"><section class="page-intro"><div class="eyebrow">StudyNotes account</div><h1>Make your progress portable.</h1><p class="lede">Create an account to save your study trail across devices.</p></section><form id="signup-form" class="auth-form"><div class="card"><label>Full name<input name="fullName" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><label><span><input name="terms" type="checkbox" required> I agree to the terms and privacy policy.</span></label><button class="button button-primary" type="submit">Create account</button><div id="auth-message" class="auth-message" hidden></div></div></form><p class="auth-footer">Already have an account? <a class="text-link" href="./signin.html">Sign in</a></p></main><script type="module" src="assets/js/auth-pages.js"></script></body></html>
