<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password | StudyNotes</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="auth">
  <main class="page-shell auth-page-shell">
    <section class="page-intro auth-intro">
      <div class="brand auth-brand" aria-label="StudyNotes"><span class="brand-mark">SN</span><span>StudyNotes</span></div>
      <div class="eyebrow">Account recovery</div>
      <h1>Choose a new password</h1>
      <p class="lede">Pick a strong password to finish resetting your account.</p>
    </section>
    <form id="reset-form" class="auth-form" novalidate>
      <div class="card">
        <label>New password
          <div class="password-toggle">
            <input name="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
            <button type="button" class="password-visibility" aria-label="Show password">Show</button>
          </div>
        </label>
        <label>Confirm password
          <div class="password-toggle">
            <input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Repeat your password" required>
            <button type="button" class="password-visibility" aria-label="Show confirm password">Show</button>
          </div>
        </label>
        <button class="button button-primary" type="submit">Update password</button>
        <div id="auth-message" class="auth-message" hidden></div>
      </div>
    </form>
  </main>
  <script type="module" src="assets/js/auth-pages.js"></script>
</body>
</html>
